services:
  app:
    image: ghcr.io/fallrising/obechow:${TAG:?TAG is required}
    restart: unless-stopped
    environment:
      DB_PATH: /data/app.db
      JAVA_TOOL_OPTIONS: -Dorg.sqlite.tmpdir=/sqlite-tmp
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /sqlite-tmp:rw,exec,nosuid,nodev,size=16m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.twitter-deck.rule: "Host(`${APP_HOST:?APP_HOST is required}`)"
      traefik.http.routers.twitter-deck.entrypoints: websecure
      traefik.http.routers.twitter-deck.tls: "true"
      traefik.http.routers.twitter-deck.tls.certresolver: le
      traefik.http.services.twitter-deck.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: edge
    external: true
